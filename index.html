<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Итоги года в Telegram</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎉 Твои итоги 2024 в Telegram</h1>
            <p class="subtitle">Готов узнать, как ты провел этот год в мессенджере?</p>
        </header>

        <main id="results" class="hidden">
            <div class="stat-card">
                <div class="stat-icon">⏱️</div>
                <div class="stat-text">
                    <div class="stat-label">Всего времени в Telegram</div>
                    <div class="stat-value" id="time-spent">...</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">✉️</div>
                <div class="stat-text">
                    <div class="stat-label">Отправлено сообщений</div>
                    <div class="stat-value" id="messages-sent">...</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">❤️</div>
                <div class="stat-text">
                    <div class="stat-label">Поставлено реакций</div>
                    <div class="stat-value" id="reactions-given">...</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">😂</div>
                <div class="stat-text">
                    <div class="stat-label">Любимый эмодзи</div>
                    <div class="stat-value" id="top-emoji">...</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">👑</div>
                <div class="stat-text">
                    <div class="stat-label">Топ-чаты</div>
                    <div class="stat-value" id="top-chat">...</div>
                </div>
            </div>

            <div class="fun-fact" id="fun-fact">
                <!-- Сюда вставится случайный факт -->
            </div>
        </main>

        <div class="action-area">
            <button id="generate-btn" class="btn-primary">Узнать мои результаты</button>
            <button id="share-btn" class="btn-secondary hidden">📤 Поделиться</button>
            <p class="hint">* Все результаты сгенерированы случайным образом для развлечения</p>
        </div>

        <footer>
            <p>Создано с ❤️ для Telegram</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
